# Täglicher Wartungs-Check (ci/check-updates.sh): neue Debian-Point-Release, neue
# Node.js-Version oder LTS-Linie, neue CVEs in den veröffentlichten Images, fehlende
# oder neue Nachweise der Basis-Images. Jeder Befund wird ein Issue mit Label
# "wartung"; ist schon eins mit gleichem Titel offen, entsteht kein zweites.
name: maintenance

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC
  workflow_dispatch:
  # Auch bei Änderungen am Check selbst, damit er nicht erst am nächsten Morgen auffällt.
  push:
    branches: [main]
    paths:
      - .github/workflows/maintenance.yml
      - ci/check-updates.sh
      - ci/open-issues.sh

permissions: {}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          # renovate: datasource=github-releases depName=google/go-containerregistry
          version: v0.22.1

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.1
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.4

      - name: Prüfen
        run: |
          ci/check-updates.sh > findings.jsonl
          {
            echo '## Wartungs-Check'
            if [ -s findings.jsonl ]; then jq -r '"- " + .title' findings.jsonl; else echo 'Keine Befunde.'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Issues anlegen
        if: hashFiles('findings.jsonl') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ci/open-issues.sh < findings.jsonl
